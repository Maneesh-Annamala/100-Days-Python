{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<style>

    .form-box {

        max-width: 450px;

        margin: 60px auto;

        background: white;

        padding: 35px;

        border-radius: 10px;

    }

    .form-box h1 {

        margin-bottom: 25px;

        text-align: center;

    }

    .form-box input {

        width: 100%;

        padding: 12px;

        margin: 8px 0 20px;

    }

    .form-box button {

        width: 100%;

        padding: 13px;

        background: black;

        color: white;

        border: none;

        border-radius: 6px;

        cursor: pointer;

    }

</style>


<div class="container">

    <div class="form-box">

        <h1>
            Login
        </h1>


        <form method="POST">

            {{ form.hidden_tag() }}


            {{ form.email.label }}

            {{ form.email() }}


            {{ form.password.label }}

            {{ form.password() }}


            {{ form.submit() }}

        </form>


        <br>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
