{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}

{% block content %}

<div class="container">
  <div class="row">
    <div class="col-sm-12">

      <h1>All Cafes</h1>

	  <table class="table table-dark table-striped table-hover">
          {% for list in cafes: %}
          <tr>
            {% for i in list: %}
              {%  if i[0:4] == 'http': %}
              <td><a href='{{ i }}''>maps link</a></td>
              {% endif %}
              <td>{{ i }}</td>
            
            {% endfor %}
          </tr>
          {% endfor %}
  	  </table>

      <p><a href="{{ url_for('home') }}">Return to index page</a></p>

    </div>
  </div>
</div>

{% endblock %}
